<!DOCTYPE html>
<meta charset="utf-8">
<title>HWID Extractor</title>
<script src="index.js"></script>
<body>
<div id="root">
  <table>
    <tr>
      <th>Device
    <tr>
      <td>TTY
      <td id="tty">Loading...
    <tr>
      <td>Cr50 Serial
      <td id="cr50Serial">
    <tr>
      <td>CCD Status
      <td id="isRestricted">
    <tr>
      <td>Challenge
      <td id="challenge">
    <tr>
      <th>Extracted Info
    <tr>
      <td>HWID
      <td id="hwid">
    <tr>
      <td>Serial Number
      <td id="serialNumber">
    <tr>
      <th>Status
    <tr>
      <td>Error
      <td id="error">
    <tr>
      <td>After Extracting
      <td id="isLockAfterExtracting">
    <tr>
      <td>Action:
      <td>
        <button id="scan">Scan</button>
  </table>
</div>
