#
# stm32 m7 devices support both JTAG and SWD transports.
#

# Working on June 10, 2019 for working enrollment

source [find interface/stlink.cfg]
#source [find interface/stlink-v2.cfg]

# JTAG speed
#adapter_khz 4000
transport select hla_swd
#transport select hla_jtag

source [find target/stm32h7x_dual_bank.cfg]
#source [find target/stm32h7x.cfg]

#adapter_khz 4000
adapter_khz 8000
#adapter_nsrst_delay 100
#adapter_nsrst_assert_width 1000
#adapter_nsrst_assert_width 500
#jtag_ntrst_delay 100
#jtag_ntrst_assert_width 1000

# Must have trst
#reset_config trst_only
#reset_config srst_only
#reset_config trst_and_srst
#reset_config trst_and_srst trst_pulls_srst
#reset_config srst_only srst_nogate
#reset_config srst_nogate
reset_config none separate
#reset_config trst_push_pull

telnet_port 4444
gdb_port 3333
gdb_memory_map disable
#gdb_memory_map enable
#gdb_flash_program enable
gdb_flash_program disable
gdb_breakpoint_override hard
