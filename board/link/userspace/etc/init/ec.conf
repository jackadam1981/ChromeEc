description    "Overrides lightbar params to tweak appearance"
author         "chromium-os-dev@chromium.org"

start on startup
task

script
  PARAMS=/usr/share/ec/lightbar_params.txt
  [ -f "$PARAMS" ] && ectool lightbar params "$PARAMS" 2>/dev/null 2>&1
end script
