description: >
  Properties for a APL6012 I2C temperature sensor

compatible: "cros-ec,temp-sensor-apl6012"

include: i2c-device.yaml

properties:
  temperature-type:
    type: string
    required: true
    description:
      One temperature sensor have 15 channel sensor types.
    enum:
      - APL6012_IDX_CH1
      - APL6012_IDX_CH2
      - APL6012_IDX_CH3
      - APL6012_IDX_CH4
      - APL6012_IDX_CH5
      - APL6012_IDX_CH6
      - APL6012_IDX_CH7
      - APL6012_IDX_CH8
      - APL6012_IDX_CH9
      - APL6012_IDX_CH10
      - APL6012_IDX_CH11
      - APL6012_IDX_CH12
      - APL6012_IDX_CH13
      - APL6012_IDX_CH14
      - APL6012_IDX_CH15
