description: >
  Properties for a thermistor temperature sensor

compatible: "cros-ec,temp-sensor-thermistor"

properties:
    adc:
      required: true
      type: phandle
      description: The named adc channel

    thermistor:
      type: phandle
      description: Underlying thermistor device

    power-good-pin:
      type: phandle
      description:
        If this sensor will be unpowered some of the time, provide an input GPIO
        which can be referenced to detect whether the sensor is powered before
        reading.
