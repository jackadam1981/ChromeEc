description: Common properties for thermistors

compatible: thermistor

properties:
  
  scaling-factor:
    required: true
    type: int
    description: Scaling factor for voltage pairs

  num-pairs:
    required: true
    type: int
    description: Number of associated pairs between temp-c and scale-mv

child-binding:
  description: The samples

  properties:
    milivolt:
      type: int
      required: true
      description: Voltage reading for a given temperature sample

    temp:
      type: int
      required: true
      description: Temperature in a temperature sample

    sample-number:
      type: int
      required: true
      description: The index of sample, needed for interpolation

  
