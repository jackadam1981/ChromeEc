# See https://www.electronics-tutorials.ws/io/thermistors.html for more information.

description: Common properties for thermistors

compatible: cros,thermistor

properties:

  scaling-factor:
    required: true
    type: int
    description: Scaling factor for voltage pairs

  num-pairs:
    required: true
    type: int
    description: Number of associated pairs between temp-c and scale-mv

  steinhart-reference-mv:
    required: true
    type: int
    description: >
      Used only for testing and getting initial data samples.
      Is the reference milivolts for the reference ohms.

  steinhart-reference-res:
    required: true
    type: int
    description: >
      Used only for testing and getting initial data samples.
      Is the reference ohms for the reference milivolts.

child-binding:
  description: Data derived from Steinhart-Hart equation in a resistor divider circuit

  properties:
    milivolt:
      type: int
      required: true
      description: Voltage reading for a given temperature datum

    temp:
      type: int
      required: true
      description: Temperature in a temperature datum

    sample-number:
      type: int
      required: true
      description: The index of a datum, needed for temperature interpolation
