description: Common properties for thermistors

compatible: thermistor

properties:
  
  scaling-factor:
    required: false
    type: int
    description: Scaling factor for voltage pairs

  num-pairs:
    required: false
    type: int
    description: Number of associated pairs between temp-c and scale-mv

  temp-c:
    required: false
    type: array
    description: Number of associated pairs between temp-c and scale-mv

  scale-mv:
     required: false
     type: array
     description: Number of associated pairs between temp-c and scale-mv

  data-pairs:
    required: false
    type: uint8-array
    description: todo

child-binding:
   description: The samples
   properties:
      milivolt:
        type: int
        required: true
      temp:
        type: int
        required: true
      sample-number:
        type: int
        required: true

  
