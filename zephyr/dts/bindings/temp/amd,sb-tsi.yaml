description: >
  Properties for an Side Band Temperature Sensor Interface sensor

compatible: "amd,sb-tsi"

include: i2c-device.yaml

properties:
    power-good-pin:
      type: phandle
      description:
        If this sensor will be unpowered some of the time, provide an input GPIO
        which can be referenced to detect whether the sensor is powered before
        reading.
