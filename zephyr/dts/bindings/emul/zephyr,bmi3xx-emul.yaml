description: Zephyr BMI3XX Emulator

compatible: "zephyr,bmi3xx-emul"

include: base.yaml

properties:
  device-model:
    type: string
    required: true
    enum:
      - BMI3XX_EMUL_3XX
    description: Model of device that is emulated.
