description: Zephyr TCPC Emulator

compatible: "cros,tcpc-emul"

include: base.yaml

properties:
    error-on-ro-write:
        type: boolean
        description:
          Flag indicating if error should be generated when read only register
          is being written.

    error-on-reserved-bit-write:
        type: boolean
        description:
          Flag indicating if error should be generated when reserved bit
          is being written.

    error-on-sequential-read:
        type: boolean
        description:
          Flag indicating if error should be generated when trying to read
          more than one register at once

    error-on-sequential-write:
        type: boolean
        description:
          Flag indicating if error should be generated when trying to write
          more than one register at once
