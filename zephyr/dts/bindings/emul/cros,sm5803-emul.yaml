description: SM5803 charger emulator

compatible: "cros,sm5803-emul"

include: base.yaml

properties:
  chg-page:
    type: phandle
    required: true
    description:
      Reference to the charger page emulator (sm5803-chg-emul) for this chip.
  battery:
    type: phandle
    required: false
    description:
      Reference to battery emulator.
