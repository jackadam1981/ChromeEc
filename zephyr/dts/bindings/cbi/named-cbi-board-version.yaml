description: CBI Board Version

compatible: "named-cbi-board-version"

child-binding:
    description:
        CBI Board Version.
    properties:
        range:
            type: array
            required: true
            description:
              Range of the board version
        alternative-device:
            type: phandle
            description:
              Alternative device that should be used
