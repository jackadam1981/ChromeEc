description: Intel modular add-in card (AIC) device

compatible: "intel,modular-aic-port"

include: intel,modular-aic-props.yaml

properties:
  id:
    type: int
    required: false
    description: |
      Port id, this is required only when port type is `MODULAR_AIC_PORT_TYPE_FIXED`.
  devices:
    type: phandles
    required: false
    description: |
      List of devices bound to a modular AIC depending on its properties.
