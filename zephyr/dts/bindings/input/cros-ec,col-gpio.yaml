description: |
  Keyboard matrix device GPIO column drive

  This can be used to handle specific keyboard matrix columns using GPIOs.
  Instantiate as a child node of the keyboard matrix device itself.

  The 'col-num', 'col-gpios', and 'settle-time-us' properties must all have
  the same number of elements.

  Example configuration:

  &kbd {
      ...
      kso-gpio {
          compatible = "cros-ec,col-gpio";
          col-num = <2>;
          col-gpios = <&gpio1 7 GPIO_ACTIVE_HIGH>;
          settle-time-us = <30>;
      };
  };

compatible: "cros-ec,col-gpio"

include: base.yaml

properties:
  col-num:
    type: array
    required: true
    description: Array of column numbers to handle

  col-gpios:
    type: phandle-array
    required: true
    description: Array of GPIOs to use to handle the corresponding columns

  settle-time-us:
    type: array
    required: true
    description: |
      Array of extra delays after changing the column state, note that this
      adds up to the parent device settle-time-us.
