description: Trogdor board names

compatible: "board-names-enum"

child-binding:
    description: Trogdor board names
    properties:
        enum-name:
            type: string
            required: true
            enum:
                - COACHZ
                - HOMESTAR
                - LAZOR
                - MARZIPAN
                - MRBLAND
                - PAZQUEL
                - POMPOM
                - WORMDINGLER
