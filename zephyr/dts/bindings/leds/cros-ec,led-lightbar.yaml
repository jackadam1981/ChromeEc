description: CrOS EC Lightbar LED
compatible: "cros-ec,led-lightbar"
child-binding:
  description: |
    Node representing a specific color for the lightbar.
  properties:
    led-id:
      type: string
      description: |
        The EC LED ID for this lightbar. This should match one of the values
        from the ec_led_id enum.
      enum:
        - "EC_LED_ID_BATTERY_LED"
        - "EC_LED_ID_POWER_LED"
        - "EC_LED_ID_ADAPTER_LED"
        - "EC_LED_ID_LEFT_LED"
        - "EC_LED_ID_RIGHT_LED"
        - "EC_LED_ID_RECOVERY_HW_REINIT_LED"
        - "EC_LED_ID_SYSRQ_DEBUG_LED"
        - "EC_LED_ID_LIGHTBAR_LED"
    strip:
      type: phandles
      required: true
      description: Phandle to the LED strip device (e.g., ws2812).
  child-binding:
    description: Node representing a specific color for the lightbar.
    properties:
      led-color:
        type: string
        required: true
        description: |
          The color this node represents. This should match one of the values
          from the led_color enum.
        enum:
          - "LED_OFF"
          - "LED_RED"
          - "LED_GREEN"
          - "LED_BLUE"
          - "LED_YELLOW"
          - "LED_WHITE"
          - "LED_AMBER"
      color:
        type: int
        required: true
        description: RGB value for the color (e.g., 0xFF0000 for red).
