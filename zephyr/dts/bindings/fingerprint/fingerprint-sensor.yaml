# Common fields for fingerprint sensors

properties:
  width:
    type: array
    required: true
    description: |
      List of supported fingerprint sensor widths in pixels.
      Represents different modes or configurations.

  height:
    type: array
    required: true
    description: |
      List of supported fingerprint sensor heights in pixels.
      Represents different modes or configurations.

  bits-per-pixel:
    type: array
    required: true
    description: |
      Pixel resolution in bits.

  frame-size:
    type: array
    required: true
    description: |
      Frame size of captured fingerprint image.

  capture-type:
    type: array
    required: true
    description: |
      Type of image capture from enum fp_capture_type

  v4l2-pixel-format:
    type: string-array
    required: true
    description: |
      List of supported Video4Linux2 pixel format types.
      Each entry in the array must be a string representing a valid V4L2 format.
      Allowed values include (but may not be limited to):
        - "V4L2_PIX_FMT_GREY"
      Full list can be found at:
      https://docs.kernel.org/userspace-api/media/v4l/pixfmt.html.
