# Common fields for fingerprint sensors

description: Fingerprint sensor configuration node properties.
compatible: "fingerprint-sensor"

properties:
  width:
    type: int
    required: true
    description: Fingerprint sensor width in pixels.

  height:
    type: int
    required: true
    description: Fingerprint sensor height in pixels.

  bits-per-pixel:
    type: int
    required: true
    description: Pixel resolution in bits.

  frame-size:
    type: int
    required: true
    description: Frame size of captured fingerprint image.

  v4l2-pixel-format:
    type: string
    required: true
    enum:
      - V4L2_PIX_FMT_GREY
    description: Video4Linux2 pixel format type.

  capture-type:
    type: int
    required: true
    description: Type of image capture.
