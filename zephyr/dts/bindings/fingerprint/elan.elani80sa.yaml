description: ELANI80SA fingerprint sensor

compatible: "elan,elani80sa"

include: [spi-device.yaml]

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      This property specifies the connection for sensor interrupt.

  reset-gpios:
    type: phandle-array
    required: true
    description: |
      This property specifies the connection for sensor reset.

  base-image-addr:
    type: int
    description: |
      Image base address from internal flash.

  ft-info-addr:
    type: int
    description: |
      Ft Info address from internal flash.
