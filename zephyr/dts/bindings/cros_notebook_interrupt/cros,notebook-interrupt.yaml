description: Interrupt driver for changing in/out of notebook mode

compatible: "cros,notebook-interrupt"

properties:
  gpios:
    type: phandle-array
    description: |
      The GPIO configuration (device, pin, and flags) to use for determining
      if the device is in laptop or tablet mode.
