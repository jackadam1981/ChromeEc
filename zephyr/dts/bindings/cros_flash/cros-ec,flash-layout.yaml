description: Describes the size and offset of the RO and RW regions

compatible: "cros-ec,flash-layout"

include: base.yaml

properties:
  type:
    type: string
    required: true
  offset:
    type: int
    required: true
  size:
    type: int
    required: true
  read-only:
    type: boolean
    required: false
