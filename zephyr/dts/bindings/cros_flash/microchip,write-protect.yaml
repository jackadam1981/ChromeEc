description: Microchip Internal Write Protect gpios

compatible: "microchip,write-protect"

properties:
  wp-gpios:
    type: phandle-array
    required: true
    description: Internal GPIOs that controls WP status for the EC SPI Not exposed to the SOC.

  wp-ex-gpios:
    type: phandle-array
    required: true
    description: External GPIOs that controls WP status from the SOC to the EC.
