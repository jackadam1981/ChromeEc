description: Associates USB-C port drivers that are served by the same PDC.

compatible: "cros-ec,pdc-port-group"

include: [base.yaml]

properties:
  ports:
    type: phandles
    required: true
    description: |
      List of handles to the USB power/data drivers for each port served by this
      PDC.

  reg:
    required: true
    description: Index of this chip / port group.