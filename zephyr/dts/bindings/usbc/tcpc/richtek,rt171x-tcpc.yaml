description: USBC RT171X TCPC

compatible: "richtek,rt171x-tcpc"

include: ["i2c-device.yaml", "cros-ec,tcpci.yaml"]

properties:
  tcpc-flags:
    type: int
    default: 0
    description: |
      TCPC configuration flags
  irq-gpios:
    type: phandle-array
    required: false
    description: |
      Interrupt from TCPC
