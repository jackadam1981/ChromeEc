description: USBC TCPC

compatible: "parade,ps8xxx"

include: ["i2c-device.yaml", "tcpc-device.yaml"]

properties:
  irq-gpios:
    type: phandle-array
    required: false
    description: |
      Interrupt from TCPC
  rst-gpios:
    type: phandle-array
    required: false
    description: |
      TCPC reset line
