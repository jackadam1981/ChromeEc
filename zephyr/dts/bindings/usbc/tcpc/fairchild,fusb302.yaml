description: USBC TCPC

compatible: "fairchild,fusb302"

include: i2c-device.yaml

properties:
  tcpc-flags:
    type: int
    default: 0
    description: |
      TCPC configuration flags
  irq-gpios:
    type: phandle-array
    required: false
    description: |
      Interrupt from TCPC using shim driver
  int-pin:
    type: phandles
    required: false
    description: |
      Interrupt from TCPC using gpio-int
