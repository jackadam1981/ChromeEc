description: USBC TCPC

compatible: "cros,tcpc"

properties:
  port:
    type: phandle
    required: true
    description: |
      I2C port used to communicate with controller

  i2c-addr-flags:
    type: string
    enum:
      - "FUSB302_I2C_ADDR_FLAGS"
      - "FUSB302_I2C_ADDR_B01_FLAGS"
      - "FUSB302_I2C_ADDR_B10_FLAGS"
      - "FUSB302_I2C_ADDR_B11_FLAGS"
      - "PS8XXX_I2C_ADDR1_P1_FLAGS"
      - "PS8XXX_I2C_ADDR1_P2_FLAGS"
      - "PS8XXX_I2C_ADDR1_FLAGS"
      - "PS8XXX_I2C_ADDR2_FLAGS"
      - "PS8XXX_I2C_ADDR3_FLAGS"
      - "PS8XXX_I2C_ADDR4_FLAGS"
    description: |
      I2C address of controller

  drv:
    type: string
    required: true
    description:
      CrOS EC driver used to communicate with chip
    enum:
      - "ps8xxx_tcpm_drv"
      - "fusb302_tcpm_drv"

  flags:
    type: int
    required: false
    default: 0
    description: |
       Value which represents TCPC_FLAGS_* or other internal flags
        for tcpc chip.
