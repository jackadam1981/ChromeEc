description: USBC TCPC

compatible: "cros,tcpc"

properties:
  port:
    type: phandle
    required: true
    description: |
      I2C port used to communicate with controller

  i2c-addr-flags:
    type: int
    required: true
    description: |
      I2C address of controller

  drv:
    type: string
    required: true
    description:
      CrOS EC driver used to communicate with chip.
      The value for PS8XXX is ps8xxx_tcpm_drv and FUSB302 is fusb302_tcpm_drv

  flags:
    type: int
    required: false
    default: 0
    description: |
       Value which represents TCPC_FLAGS_* or other internal flags
        for tcpc chip.
