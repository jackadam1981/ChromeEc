description: Power path chip

properties:
  port:
    type: phandle
    required: true
    description: |
      I2C port used to communicate with controller

  irq:
    type: phandles
    required: false
    description: |
      GPIO interrupt from PPC

  alternate-for:
    type: phandle
    description: |
      Pointer to device that should be replace under some conditions
