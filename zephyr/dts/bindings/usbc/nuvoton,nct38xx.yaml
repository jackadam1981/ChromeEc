description: Nuvoton NCT38XX USB TCPC binding

compatible: "nuvoton,nct38xx"

properties:
  tcpc-port:
    type: phandle
    description: |
      Pointer to the TCPC device. This is used to binding the Cros USB port
      index to TCPC device.
