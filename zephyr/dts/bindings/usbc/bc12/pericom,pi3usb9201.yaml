description: Pericom PI3USB9201, Dual-Role USB Charging-Type Detector

compatible: "pericom,pi3usb9201"

include: [base.yaml, i2c-device.yaml]

properties:
    intb-gpios:
      type: phandle
      required: false
      description: |
        GPIO input connected to the active low interrupt INTB pin on the PI39201.

    enable-gpios:
      type: phandle
      required: false
      description: |
        GPIO output connected to the system enable ENB pin on the PI39201.

    always-powered:
      type: boolean
      required: false
      description: |
        If true, this PI3USB9201 device is always powered.
        FIXME - move to common bc1.2 handler?

    client-mode-only:
      type: boolean
      required: false
      description: |
        If true, this PI3USB9201 device only supports client-mode operation. If
        false, then both host-mode and client-mode operation is supported.
