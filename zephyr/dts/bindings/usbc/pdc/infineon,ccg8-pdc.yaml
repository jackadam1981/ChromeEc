description: Infineon PDC CCG8 Power

compatible: "infineon,pdc-ccg8"

include: ["i2c-device.yaml"]

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt line from the PD for power path (zephyr standard GPIO format)
