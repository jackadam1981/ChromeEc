description: USBC PPC

compatible: "silergy,syv682x"

include: ["i2c-device.yaml", "ppc-chip.yaml"]

properties:
  frs_en_gpio:
    type: phandle
    description: The GPIO that controls FRS enable on this device
    required: false
  irq-gpios:
    type: phandle-array
    required: false
    description: |
      Interrupt from PPC using shim driver
