description: USBC TCPC

compatible: "cypress,ccgxxf"

properties:
  port:
    type: phandle
    required: true
    description: |
      I2C port used to communicate with controller

  i2c-addr-flags:
    type: string
    default: "CCGXXF_I2C_ADDR1_FLAGS"
    enum:
      - "CCGXXF_I2C_ADDR1_FLAGS"
      - "CCGXXF_I2C_ADDR2_FLAGS"
    description: |
      I2C address of controller
