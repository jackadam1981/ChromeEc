description: |
  Analogix re-timing MUX

include: ["i2c-device.yaml", "cros-ec,usbc-mux.yaml"]

compatible: "analogix,anx7452"

properties:
  flags:
    type: int
    required: false
    default: 0
    description: |
      Mask of flags defined in dt-bindings/usbc_mux.h

  usb-en-pin:
    type: phandle
    required: true

  dp-en-pin:
    type: phandle
    required: false

  hpd-in-pin:
    type: phandle
    required: false
