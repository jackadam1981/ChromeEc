description: USBC TCPC USB MUX

include: cros-ec,usbc-mux.yaml

compatible: "cros-ec,usbc-mux-tcpci"

properties:
  hpd-update:
    type: string
    required: false
    description: |
      Name of function used as hpd_update callback
    enum:
      - ps8xxx_tcpc_update_hpd_status

  port:
    type: phandle
    required: false
    description: |
      Phandle to the named i2c port. If provided, i2c-addr-flags property has
      to be present and USB_MUX_FLAG_NOT_TCPC flag is added to USB mux flags.
      Otherwise I2C configuration from tcpc_config of given USB-C port is used
      to communicate with this USB mux.

  i2c-addr-flags:
    type: int
    required: false
    description: |
      I2C address of chip. If provided, port property hat to be present too.
      Please check description of port property for more information.
