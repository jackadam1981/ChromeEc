description: Common properties for USB-C mux

properties:
  flags:
    type: int
    required: false
    default: 0
    description: |
      Mask of flags defined in dt-bindings/usbc_mux.h

  board-init:
    type: string
    required: false
    description: |
      Name of function used as board_init callback

  board-set:
    type: string
    required: false
    description: |
      Name of function used as board_set callback

properties:
  is-alt:
    type: boolean
    required: false
    description: |
      If present, this node refers to an alternate MUX device. The MUX
      device is not used by default, and must be manually enabled at
      runtime.
