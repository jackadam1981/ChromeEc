description: Analogix 7451 re-timing MUX

compatible: "analogix,anx7451"

include: ["i2c-device.yaml", "cros-ec,usbc-mux.yaml"]

properties:
  flags:
    type: int
    required: false
    default: 0
    description: |
      Mask of flags defined in dt-bindings/usbc_mux.h

  usb-en-pin:
    type: phandle
    required: true

  dp-en-pin:
    type: phandle
    required: false
