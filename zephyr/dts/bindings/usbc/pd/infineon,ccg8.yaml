description: Infineon CCG8 Power Delivery Controller

compatible: "infineon,ccg8"

include: ["i2c-device.yaml"]

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt line from the PD for power path (zephyr standard GPIO format)
  irq-shared:
    type: boolean
    description: |
      Interrupt line is shared between ports in a dual port solution.
      Define it only for the secondary port so that the driver doesn't
      trigger multiple events.
