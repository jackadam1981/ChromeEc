description: |
  Hybrid Power Boost Charger chip

compatible: "hpb-charger"

properties:
  minimum-voltage-required:
    type: int
    default: 15000
    description: |
      Minimum voltage (in millivolts) required to charge battery for hybrid
      boost chargers.
