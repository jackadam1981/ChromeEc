description: |
  Properties common to all Hybrid Power Boost (HBP) charger chips

properties:
  minimum-voltage-required:
    type: int
    required: true
    default: 15000
    description: |
      Minimum voltage (in millivolts) required to charge battery for hybrid
      boost chargers.
