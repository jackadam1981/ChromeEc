description: GPIO interrupts list

compatible: "cros-ec,gpio-interrupts"

child-binding:
  description: GPIO Interrupt definition.
  properties:
    gpio:
      type: phandle
      required: true
      description: The GPIO source of the interrupt.
    flags:
      type: int
      required: true
      description: The zephyr gpio interrupt config flags.
    handler:
      type: string
      description: The C function name attached to this interrupt.

