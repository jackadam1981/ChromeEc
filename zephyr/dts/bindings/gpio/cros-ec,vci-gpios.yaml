description: VCI GPIO definition

compatible: "cros-ec,vci-gpios"

include: [gpio-controller.yaml, base.yaml]

properties:
  "#gpio-cells":
    required: true
    const: 2
    description:
      Number of parameters describing the pin

  ngpios:
    required: true
    description:
      Number of pins per port

gpio-cells:
  - pin
  - flags
