include: base.yaml

description: |
  GPIO Debounce.
   - Name
   - Type
   - GPIO handle
   - Debounce time (us)
   - Flags

compatible: "generic,gpio-debounce"

description: GPIO Debounce configuration
properties:
  button_type:
    type: int
    required: false
    description: Keyboard button type
  gpios:
    type: phandle-array
    required: true
  debounce_us:
    type: int
    required: true
    description: Debounce time in microseconds
