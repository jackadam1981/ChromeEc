description: |
    The power signals are defined using different compatibles,
    which configure the source of the signal (GPIO, VW, external etc.).
    All signals use a common base enum-name so that the core code
    can use consistent names.

properties:
    dbg-label:
        type: string
        required: true
        description: Label of power signals used in debug messages

    enum-name:
        type: string
        required: true
        description: Enumeration values for power signals
        enum:
        - PWR_PG_EC_DSW_PWROK
        - PWR_EC_PCH_RSMRST
        - PWR_EN_PP5000_A
        - PWR_PG_EC_RSMRST
        - PWR_SLP_S3
        - PWR_ALL_SYS_PWRGD
        - PWR_SYS_RST
        - PWR_EC_PCH_SYS_PWROK
        - PWR_PCH_PWROK
        - PWR_IMVP9_VRRDY
        - PWR_VCCST_PWRGD
        - PWR_SLP_SUS
        - PWR_SLP_S0_DEASSERTED
        - PWR_SLP_S3_DEASSERTED
        - PWR_SLP_S4_DEASSERTED
        - PWR_SLP_S5_DEASSERTED
        - PWR_SLP_SUS_DEASSERTED
