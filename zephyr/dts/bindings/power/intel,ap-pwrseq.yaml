description: Common fields for AP power sequence

compatible: "intel,ap-pwrseq"

properties:
    dsw-pwrok-delay:
      type: int
      required: false
      default: 10
      description: |
        Delay to set DSW_PWROK high to PCH after 3.3V rail stable,
        in milliseconds.

    rsmrst-delay:
      type: int
      required: false
      default: 10
      description: |
        Delay to set RSMRST from EC to SoC, in milliseconds.

    sys-pwrok-delay:
      type: int
      required: false
      default: 45
      description: |
        Delay from PG_EC_ALL_SYS_PWRGD high to set EC_PCH_SYS_PWROK high,
        in milliseconds.

    pm-pwrbtn-delay:
      type: int
      required: false
      default: 200
      description: |
        Power button delay, in milliseconds.

    pch-pwrok-delay:
      type: int
      required: false
      default: 2
      description: |
        Delay in ms from IMVP9_VRRDY high to PCH_PWROK high delay.

    vccst-pwrgd-delay:
      type: int
      required: false
      default: 2
      description: |
        Delay in ms from PG_EC_ALL_SYS_PWRGD high
        to VCCST_PWRGD high.

    sys-reset-delay:
      type: int
      required: false
      default: 32
      description: Debounce time for SYS_RESET_L.

    vrrdy-timeout:
      type: int
      required: false
      default: 50
      description: |
        Timeout in ms for IMVP9_VRRDY high.

    all-sys-pwrgd-timeout:
      type: int
      required: false
      default: 0
      description: |
        Timeout in ms for ALL_SYS_PWRGD to EC to be high.

    wait-signal-timeout:
      type: int
      required: false
      default: 1000
      description: |
        Timeout in ms for monitoring power signals.

    pg-ec-dsw-pwroks-gpios:
      type: phandle-array
      required: false
      description: |
        VR/Circuit to EC 3.3V power good signal.

    ec-pch-rsmrst-odl-gpios:
      type: phandle-array
      required: false
      description: |
        EC to PCH RSMRST power good signal.

    en-pp5000-s5-gpios:
      type: phandle-array
      required: false
      description: |
        Enable 5V rail.

    pg-ec-rsmrst-odl-gpios:
      type: phandle-array
      required: false
      description: |
        VR/Circuit to EC RSMRST power good for
        VCCPRIM rails and other S5 rails.

    slp-s3-l-gpios:
      type: phandle-array
      required: false
      description: |
        SLP_S3 signal for S3 sleep control from SoC.

    pg-ec-all-sys-pwrgd-gpios:
      type: phandle-array
      required: false
      description: |
        This represents the power good for all
        the platform voltage rails to EC.

    sys-rst-l-gpios:
      type: phandle-array
      required: false
      description: |
        SYS Reset signal.

    ec-pch-sys-pwrok-gpios:
      type: phandle-array
      required: false
      description: |
        SYS_PWROK is a generic power good input to the PCH,
        driven and utilized in a platform specific manner.

    pch-pwrok-gpios:
      type: phandle-array
      required: false
      description: |
        PCH PWROK assertion indicates all the main PCH
        primary rails and all the CPU rails are up.

    imvp9-vrrdy-od-gpios:
      type: phandle-array
      required: false
      description: |
        IMVP VRRDY signal to EC indicates that the IMVP
        start-up sequence is complete.

    vccst-pwrgd-od-gpios:
      type: phandle-array
      required: false
      description: |
        VCCST PWRGD signal from EC to indicate that the
        VCC1P05_PROC/VDDQ power supplies are stable and
        within specification.

    slp-sus-l-gpios:
      type: phandle-array
      required: false
      description: |
        SLP_SUS signal from SoC to EC.
