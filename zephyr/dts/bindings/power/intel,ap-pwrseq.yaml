description: |
    Common fields for AP power sequence configuration
    The configuration consists of a number of mostly timing
    related values, as well as child nodes defining the
    different power signals and controls.

    Different types of power signal sources can be set, such as
    input GPIOs, output GPIOs ESPI virtual wire, and board specific sources.
    The source is determined by the properties set in the child node.
    They should be considered mutually exclusive.

compatible: "intel,ap-pwrseq"

properties:
    dsw-pwrok-delay:
      type: int
      required: false
      default: 10
      description: |
        Delay to set DSW_PWROK high to PCH after 3.3V rail stable,
        in milliseconds.

    rsmrst-delay:
      type: int
      required: false
      default: 10
      description: |
        Delay to set RSMRST from EC to SoC, in milliseconds.

    sys-pwrok-delay:
      type: int
      required: false
      default: 45
      description: |
        Delay from PG_EC_ALL_SYS_PWRGD high to set EC_PCH_SYS_PWROK high,
        in milliseconds.

    pm-pwrbtn-delay:
      type: int
      required: false
      default: 200
      description: |
        Power button delay, in milliseconds.

    pch-pwrok-delay:
      type: int
      required: false
      default: 2
      description: |
        Delay in ms from IMVP9_VRRDY high to PCH_PWROK high delay.

    vccst-pwrgd-delay:
      type: int
      required: false
      default: 2
      description: |
        Delay in ms from PG_EC_ALL_SYS_PWRGD high
        to VCCST_PWRGD high.

    sys-reset-delay:
      type: int
      required: false
      default: 32
      description: Debounce time for SYS_RESET_L.

    vrrdy-timeout:
      type: int
      required: false
      default: 50
      description: |
        Timeout in ms for IMVP9_VRRDY high.

    all-sys-pwrgd-timeout:
      type: int
      required: false
      default: 0
      description: |
        Timeout in ms for ALL_SYS_PWRGD input to EC to be high.

    wait-signal-timeout:
      type: int
      required: false
      default: 1000
      description: |
        Timeout in ms for monitoring power signals.

    pwrseq-espi-max-freq:
      type: int
      required: false
      default: 20
      description: |
        Maximum configured frequency for espi channel.

child-binding:
    description: |
        Power sequence signals list child node.

        All signals are treated as logical signals i.e a value of 1
        is an asserted signal. For signals that are inverted at the
        physical source, they should be configured to be read as an
        active low signal and converted to a logical signal e.g for
        GPIOs that are an active low signal, the GPIO_ACTIVE_LOW
        flag should be set in the GPIO flags.

    properties:
        # The first 2 properties are common for all types of sources
        dbg-label:
            type: string
            required: true
            description: Label of power signals used in debug messages

        enum-name:
            type: string
            required: true
            description: Enumeration values for power signals
            enum:
            - PWR_PG_EC_DSW_PWROK
            - PWR_EC_PCH_RSMRST
            - PWR_EN_PP5000_A
            - PWR_PG_EC_RSMRST
            - PWR_SLP_S3
            - PWR_ALL_SYS_PWRGD
            - PWR_SYS_RST
            - PWR_EC_PCH_SYS_PWROK
            - PWR_PCH_PWROK
            - PWR_IMVP9_VRRDY
            - PWR_VCCST_PWRGD
            - PWR_SLP_SUS

        # The next properties is specific for output GPIOs.
        output-gpios:
            type: phandle-array
            required: false
            description: Output GPIO.

        # The next 3 properties are specific for input GPIOs.
        input-gpios:
            type: phandle-array
            required: false
            description: |
              GPIO to be used for input signal. Input GPIOs can be
              configured to generate an interrupt if the 'interrupt-flags'
              property is set with the appropriate interrupt flags.

        interrupt-flags:
            type: int
            required: false
            description: GPIO interrupt configuration flags.

        enable-interrupt-on-boot:
            type: boolean
            description: true - Enable GPIO interrupt at boot up;
                         false - Do not enable GPIO interrupt at boot up.

        # Defined for a virtual wire signal source.
        virtual-wire:
            type: string
            required: false
            description: |
              Enumeration value to eSPI signals that can be sent
              or received through virtual wire channel

            enum:
            - ESPI_VWIRE_SIGNAL_SLP_S3
            - ESPI_VWIRE_SIGNAL_SLP_S4
            - ESPI_VWIRE_SIGNAL_SLP_S5

        # Defined for a board provided signal.
        external:
            type: boolean
            description: |
              A signal that is provided from an external board
              specific function.
