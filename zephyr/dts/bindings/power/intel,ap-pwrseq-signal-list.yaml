description: Power sequence signals information list.
    The signals could be GPIO signals, eSPI signals through virtual wire.

compatible: "intel,ap-pwrseq-signal-list"

properties:
    pwrseq-signals-required:
        description:
            Total of power signals in power sequence, including GPIOs and
            virtual wires
        type: int
        required: true

child-binding:
    description: Power sequence signals list child node
    properties:
        dbg-label:
            type: string
            required: true
            description: Label of power signals used in debug messages

        source:
            type: int
            required: true
            description: indicates which source generates the power signal
                         0 - GPIO pin
                         1 - ESPI through virtual wire
                         2 - Others, ADC, etc

        pwrseq-int-gpios:
            type: phandle-array
            required: false
            description: Associated GPIO interrupts pin

        pwrseq-int-flags:
            type: int
            required: false
            description: GPIO interrupt configuration flags.

        pwrseq-vw-enum:
            type: string
            required: false
            description: Enumeration value to eSPI signals that can be sent
              or received through virtual wire channel
            enum:
            - ESPI_VWIRE_SIGNAL_SLP_S3
            - ESPI_VWIRE_SIGNAL_SLP_S4
            - ESPI_VWIRE_SIGNAL_SLP_S5

        pwrseq-signal-enum:
            type: string
            required: true
            description: Enumeration values for power signals

        flags:
            type: int
            required: true
            description: bit 0 represents active in high or low state
                         bit 1 Disable signal at boot up
              bit[0] = 1 active high
              bit[0] = 0 active low
              bit[1] = 1 During boot up, disable interrupt of this signal
              bit[1] = 0 Enable interrupt of signal during boot up
