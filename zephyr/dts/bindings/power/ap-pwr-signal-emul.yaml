description: |
  Enables emulating power signal behavior to allow testing AP power sequence.

compatible: "ap-pwr-signal-emul"

properties:
  output-signal:
    type: phandle
    required: true
    description: |
      Output signal that will trigger associated input signals in child node.

  assert-value:
    type: int
    required: false
    default: 1
    description: |
      Value that output signal requires to be considered asserted.

  edge:
    type: string
    required: false
    description: |
      Output signal edge that will activate corresponding input signals.
    default: EDGE_ACTIVE_ON_BOTH
    enum:
      - EDGE_ACTIVE_ON_ASSERT
      - EDGE_ACTIVE_ON_DEASSERT
      - EDGE_ACTIVE_ON_BOTH

  init-value:
    type: int
    required: false
    description: |
      Value set to output signal when initialized.

child-binding:
  description: |
    Input power signal associated to output signal in parent node.

  properties:
    input-signal:
      type: phandle
      required: true
      description: |
        Input signal that will be triggered by output signal in parent node.

    assert-value:
      type: int
      required: false
      default: 1
      description: |
        Value that will be assigned to input signal when parent outut signal
        gets asserted.

    assert-delay-ms:
      type: int
      required: false
      default: 10
      description: |
        Amount of ms to set `assert-value` to input signal when output signal
        gets asserted.

    deassert-value:
      type: int
      required: false
      default: 0
      description: |
        Value that will be assigned to input signal when parent outut signal
        gets deasserted.

    deassert-delay-ms:
      type: int
      required: false
      default: 10
      description: |
        Amount of ms to set `deassert-value` to input signal when output signal
        gets deasserted.

    init-value:
      type: int
      required: false
      description: |
        Value set to output signal when initialized.

    invert-value:
      type: boolean
      description: |
        Flag to invert this input signal assertion logic.
