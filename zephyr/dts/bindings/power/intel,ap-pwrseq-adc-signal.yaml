description: Power sequence analog signals container.

compatible: "intel,ap-pwrseq-adc-signal"

child-binding:
  description: ADC comparators used to produce power signal
  properties:
    trigger-high:
      description: Rising edge trigger adc comparator
      type: phandle
      required: true

    trigger-low:
      description: Falling edge trigger adc comparator
      type: phandle
      required: true

    pwrseq-signal-enum:
        type: string
        required: true
        description: Enumeration values for power signals
