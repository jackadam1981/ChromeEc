description: |
  Complementary power sequence states

compatible: "ap-pwrseq-sub-state"

child-binding:
  description: |
    Complementary power sequence states
  properties:
    state:
      type: string
      required: true
      description: |
        User defined power subtstates, use AP_POWER_SUB_STATE_DEFINE, to define
        any additional substate action handler functions.
