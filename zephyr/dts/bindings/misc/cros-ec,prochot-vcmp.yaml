description: |
  PROCHOT signal detection, uses a voltage comparator device to detect
  transitions of the PROCHOT signal and log it on the console if the AP is
  active.

  Example configuration:

  prochot-vcmp {
      compatible = "cros-ec,prochot-vcmp";
      vcmp = <&vcmp0>;
      high-level-mv = <1050>;
      prochot {
          gpios = <&gpioi 0 (GPIO_ACTIVE_LOW | GPIO_LINE_OPEN_DRAIN)>;
          pinctrl-0 = <&adc0_ch0_gpi0_default>;
          pinctrl-1 = <&adc0_ch0_gpi0_gpio>;
          pinctrl-names = "default", "gpio";
      };
  };

  &vcmp0 {
      status = "okay";
      scan-period = <IT8XXX2_VCMP_SCAN_PERIOD_5MS>;
      comparison = <IT8XXX2_VCMP_GREATER>;
      threshold-mv = <0>;
      io-channels = <&adc0 0>;
  };

  &adc0 {
      pinctrl-0 = <&adc0_ch0_gpi0_default>; /* ...and other ADC signals */
      pinctrl-names = "default";
  };

  Note: the voltage comparator initial configuration is irrelevant, the device
  is reconfigured automatically in runtime.

compatible: "cros-ec,prochot-vcmp"

include: base.yaml

properties:
  vcmp:
    description: Voltage comparator device to use.
    type: phandle
    required: true

  high-level-mv:
    description: |
      Signal voltage for the high level, in millivolts, detection thresholds
      will be set to 10% and 90% of this value.
    type: int
    required: true

child-binding:
  description: |
    Optional PROCHOT GPIO settings.

    If a child node named "prochot" is present, then the prochot-vcmp driver
    supports both monitoring PROCHOT and asserting PROCHOT using the same
    pin on the EC.

    On initialization, the driver defaults to monitoring mode. If the EC
    application calls chipset_throttle_cpu(), then the driver reconfigures
    the PROCHOT pin as an output and asserts the pin.

  include:
    - name: pinctrl-device.yaml

  properties:
    gpios:
      type: phandle-array
      description: |
        The EC will assert this GPIO when an internal PROCHOT condition is
        triggered. This pin is typically an open-drain signal that is active
        low.

    pinctrl-0:
      required: true
      description: |
        Defines the pinctrl to configure the PROCHOT pin as an ADC input.

    pinctrl-1:
      required: true
      description: |
        Defines the pinctrl to configure the PROCHOT pin as GPIO output.

    pinctrl-names:
      required: true
