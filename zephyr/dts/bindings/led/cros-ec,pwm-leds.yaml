description: PWM LED configuration

compatible: "cros-ec,pwm-leds"

include: base.yaml

properties:
  leds:
    type: phandles
    required: true
    description: |
      List of pwm-leds nodes. These are expected to have a pwms property
      pointing to the relevant PWMs, in red, green, blue and optionally sidesel
      order.

  color-map-red:
    type: array
    required: true
    description: |
      A map of PWM duty cycles per color, up to three channels.

  color-map-green:
    type: array
    required: true

  color-map-blue:
    type: array
    required: true

  color-map-yellow:
    type: array
    required: true

  color-map-white:
    type: array
    required: true

  color-map-amber:
    type: array
    required: true
