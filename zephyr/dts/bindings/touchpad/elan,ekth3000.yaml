description: Elan I2C touchpad

compatible: "elan,ekth3000"

include: i2c-device.yaml

properties:
  irq:
    type: phandle
    required: true
    description: Interrupt from touchpad
  en-pin:
    type: phandle
    required: false
    description:
      Optional enable pin. Logical high means enabled.

      If not defined, board must implement a customized
      reset callback function `board_touchpad_reset()`.
