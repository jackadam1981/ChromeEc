description: Motion sense rotation reference parent node

compatible: "cros-ec,motionsense-rotation-ref"

child-binding:
  description: A rotation matrix node is used to create a rotation matrix
               which is used by motion sensors.
  properties:
    mat33:
      required: true
      type: array
      description: 3x3 matrix to rotate x, y, and z axes.
