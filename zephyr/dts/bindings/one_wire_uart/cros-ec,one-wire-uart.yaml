description: One wire UART module

compatible: "cros-ec,one-wire-uart"

include: base.yaml

properties:
  id:
    type: int
    enum:
      - 0
      - 1
    required: true
    description: |
      ID bit for loopback detection. The implementation uses this ID to detect
      if a packet is sent from remote or not.

      For CrOS detachable devices, use 0 for keyboard, and 1 for tablet.
