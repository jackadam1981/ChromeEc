description: MediaTek MT8186, Power Signal List
compatible: "mediatek,mt8186-power-signal-list"

include: power-signal-list.yaml

properties:
  power-signals-required:
    default: 6

child-binding:
  properties:
    power-enum-name:
      enum:
        - AP_IN_RST
        - AP_IN_S3
        - AP_WDT_ASSERTED
        - AP_WARM_RST_REQ
        - PG_PP4200_S5
        - PMIC_AP_RST