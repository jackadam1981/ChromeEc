description: "COSMX L26X2PK1"
compatible: "cosmx,l26x2pk1"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "cosmx,l26x2pk1"

  # Fuel gauge
  manuf_name:
    default: "COSMX"
  device_name:
    default: "L26X2PK1"
  ship_mode_reg_addr:
    default: 0x34
  ship_mode_reg_data:
    default: [0x0000, 0x1000]
  # Manufacturer Access 0x0054
  # b13: D-FET
  # b14: C-FET
  flags:
    default: 0x00
  fet_reg_addr:
    default: 0x0054
  fet_reg_mask:
    default: 0x2000
  fet_disconnect_val:
    default: 0x0000
  fet_cfet_mask:
    default: 0x4000
  fet_cfet_off_val:
    default: 0x0000

  # Battery info
  voltage_max:
    default: 8800
  voltage_normal:
    default: 7540
  voltage_min:
    default: 6000
  precharge_current:
    default: 226
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 50
  charging_min_c:
    default: 0
  charging_max_c:
    default: 60
  discharging_min_c:
    default: -20
  discharging_max_c:
    default: 70
