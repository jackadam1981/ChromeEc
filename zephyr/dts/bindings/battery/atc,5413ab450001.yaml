description: "ATC 5413AB450001"
compatible: "atc,5413ab450001"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "atc,5413ab450001"

  # Fuel gauge
  manuf_name:
    default: "5413AB450001"
  device_name:
    default: "BTY-M4B"
  ship_mode_reg_addr:
    default: 0x00
  ship_mode_reg_data:
    default: [0x00, 0x00]
  flags:
    default: 0x0004
  fet_reg_addr:
    default: 0x0054
  fet_reg_mask:
    default: 0x0006
  fet_disconnect_val:
    default: 0x0000
  fet_cfet_mask:
    default: 0x0004
  fet_cfet_off_val:
    default: 0x0000

  # Battery info
  voltage_max:
    default: 13200
  voltage_normal:
    default: 11550
  voltage_min:
    default: 9000
  precharge_current:
    default: 256
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 60
  charging_min_c:
    default: 0
  charging_max_c:
    default: 60
  discharging_min_c:
    default: -20
  discharging_max_c:
    default: 60
