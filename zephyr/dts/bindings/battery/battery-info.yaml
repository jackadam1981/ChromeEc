description:
   Information about battery
   Voltage is in millivolts
   Current is in milliamperes
   Temperature is in Celsius degrees

compatible: "battery-info"

properties:
   voltage_max:
      type: int
   voltage_normal:
      type: int
   voltage_min:
      type: int
   precharge_voltage:
      type: int
   precharge_current:
      type: int
   start_charging_min_c:
      type: int
   start_charging_max_c:
      type: int
   charging_min_c:
      type: int
   charging_max_c:
      type: int
   discharging_min_c:
      type: int
   discharging_max_c:
      type: int
