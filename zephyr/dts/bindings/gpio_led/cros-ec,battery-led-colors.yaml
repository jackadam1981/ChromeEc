description: Battery LED colors parent node

compatible: "cros-ec,battery-led-colors"

child-binding:
    description: Nodes based on charge state
    properties:
        charge-state:
            description: This property is used to describe the power state
                         of the node
            type: string
            required: false
            enum:
                - PWR_STATE_CHARGE
                - PWR_STATE_DISCHARGE
                - PWR_STATE_ERROR
                - PWR_STATE_IDLE
                - PWR_STATE_CHARGE_NEAR_FULL
        chipset-state:
            description: If the LED color depends on chipset state, this
                         property is used to describe it. ANY is used if
                         the color doesn't depend on the chipset state
            type: string
            required: false
            enum:
                - S0
                - S3
                - S5
                - ANY

        extra-flag:
            description: If the LED color depends on additional factors
            type: string
            required: false
            enum:
                - NONE
                - CHFLAG_FORCE_IDLE
                - CHFLAG_DEFAULT
                - BATT_BELOW_10
                - BATT_ABOVE_10

    child-binding:
        description: Color nodes describing color to set for this power state
        properties:
            led-color:
                type: string
                required: true
                enum:
                    - LED_OFF
                    - LED_RED
                    - LED_GREEN
                    - LED_BLUE
                    - LED_YELLOW
                    - LED_WHITE
                    - LED_AMBER
            period:
                description: In case of blinking LEDs, this is ON_SEC + OFF_SEC
                type: int
                required: false
