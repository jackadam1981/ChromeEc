description: Led control color

compatible: "led-control"

properties:
    led-color:
        type: string
        required: true
        enum:
            - LED_RED
            - LED_GREEN
            - LED_BLUE
            - LED_YELLOW
            - LED_AMBER
            - LED_WHITE
