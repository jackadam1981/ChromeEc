description: Brightness range array to specifiy which LEDs are enabled

compatible: "cros-ec,led-brightness-range"

properties:
    brightness-range-battery:
        type: array
        required: true
        description: Brightness range values for gpio leds,
                     1 for the enabled LEDs, otherwise 0

    brightness-range-power:
        type: array
        required: false
        description: Brightness range values for gpio leds,
                     1 for the enabled LEDs, otherwise 0
