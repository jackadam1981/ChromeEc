description: Current board name

compatible: "current-board"

properties:
    current-board-name:
        type: string 
        required: true
        description: Current board name
        enum:
            - COACHZ
            - HOMESTAR
            - LAZOR
            - MARZIPAN
            - MRBLAND
            - PAZQUEL
            - POMPOM
            - WORMDINGLER
