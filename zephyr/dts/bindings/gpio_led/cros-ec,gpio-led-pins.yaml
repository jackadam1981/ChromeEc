description: GPIO LED pins parent node

compatible: "cros-ec,gpio-led-pins"

child-binding:
    description: Each child node describes all the GPIO pins that need to be
                 altered to set a specific color for a particular LED type.

                 Eg. for a board supporting Blue and Amber BAT LEDs on left
                 and right ports, to set LED_AMBER color on left port,
                 Amber LED will need to be set to 1 and blue LED to 0.
                 color-amber-left {
                              led-color = "LED_AMBER";
                              led-type = BATT_LED_LEFT;
                              led-pins = <&gpio_ec_chg_led_y_c1 1>,
                                         <&gpio_ec_chg_led_b_c1 0>;
                                         <&gpio_ec_chg_led_y_c0 0>;
                                         <&gpio_ec_chg_led_b_c0 0>;
                             };
    properties:
        led-color:
            type: string
            required: true
            enum:
                - LED_OFF
                - LED_RED
                - LED_GREEN
                - LED_BLUE
                - LED_YELLOW
                - LED_WHITE
                - LED_AMBER
        led-type:
            type: string
            required: false
            enum:
                - BATT_LED_ANY
                - BATT_LED_LEFT
                - BATT_LED_RIGHT
                - POWER_LED
        led-pins:
            type: phandle-array
            required: false
