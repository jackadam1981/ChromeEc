description: Power LED colors parent node

compatible: "power-led-colors"

child-binding:
    description: These properties set the LED color based on the power
                 state of the system.
    properties:
        led-color:
            type: string
            required: false
            enum:
                - LED_OFF
                - LED_RED
                - LED_GREEN
                - LED_BLUE
                - LED_YELLOW
                - LED_AMBER
                - LED_WHITE

        led-color-1:
            type: string
            required: false
            enum:
                - LED_OFF
                - LED_RED
                - LED_GREEN
                - LED_BLUE
                - LED_YELLOW
                - LED_AMBER
                - LED_WHITE

        led-color-2:
            type: string
            required: false
            enum:
                - LED_OFF
                - LED_RED
                - LED_GREEN
                - LED_BLUE
                - LED_YELLOW
                - LED_AMBER
                - LED_WHITE

        period:
            type: int
            required: false
            description: If blinking LEDs, what's the period value
