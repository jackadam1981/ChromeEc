description: GPIO LED color enums. This is used to create board specific
             LED_COLOR enums for the supported colors

compatible: "cros-ec,led-color-enums"

child-binding:
    description: LED color nodes with enum prop
    properties:
      enum-name:
        type: string
        required: true
        enum:
            - LED_RED
            - LED_GREEN
            - LED_BLUE
            - LED_YELLOW
            - LED_AMBER
            - LED_WHITE
