common:
  platform_allow: native_posix
tests:
  fingerprint.task:
    extra_configs:
    - CONFIG_LINK_TEST_SUITE_FINGERPRINT_UNINITIALIZED=y
    extra_conf_files:
    - prj.conf

  fingerprint.task.tpm_and_userid_set:
    extra_configs:
    - CONFIG_LINK_TEST_SUITE_FINGERPRINT_TPM_AND_USERID_SET=y
    extra_conf_files:
    - prj.conf
