tests:
  motion_sense.brox:
    harness: gtest
    timeout: 10
    platform_allow:
      - native_sim
    extra_dtc_overlay_files:
      - boards/native_sim.overlay
      - boards/brox.overlay
    extra_configs:
      - CONFIG_PLATFORM_EC_ACCEL_FORCE_MODE_THRESHOLD_RATE_MS=50
      - CONFIG_PLATFORM_EC_LID_SWITCH=y
  motion_sense.rex:
    harness: gtest
    timeout: 10
    platform_allow:
      - native_sim
    extra_dtc_overlay_files:
      - boards/native_sim.overlay
      - boards/rex.overlay
    extra_configs:
      - CONFIG_PLATFORM_EC_ACCEL_FORCE_MODE_THRESHOLD_RATE_MS=50
      - CONFIG_EMUL_COMMON_I2C=y
