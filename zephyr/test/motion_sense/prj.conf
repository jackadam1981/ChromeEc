CONFIG_TEST=y
CONFIG_EMUL=y
CONFIG_ASSERT=y

# C++ configs:
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP20=y

CONFIG_PIGWEED_ASSERT=y

# Enable logging (needed to capture gTest output)
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PIGWEED_LOG_ZEPHYR=y
CONFIG_PIGWEED_SYS_IO=y

# Power sequencing is needed to get to S0
#CONFIG_PLATFORM_EC_HOSTCMD=y
#CONFIG_PLATFORM_EC_POWER_BUTTON=y
#CONFIG_PLATFORM_EC_POWERSEQ=y

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y

CONFIG_PLATFORM_EC=y
CONFIG_CROS_EC=y
CONFIG_SHIMMED_TASKS=y

CONFIG_PLATFORM_EC_ACCEL_FIFO=y
CONFIG_PLATFORM_EC_SENSOR_TIGHT_TIMESTAMPS=y

# Console
CONFIG_PLATFORM_EC_CONSOLE_DEBUG=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCELS=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_HELP=y
CONFIG_SERIAL=y
CONFIG_RING_BUFFER=y
