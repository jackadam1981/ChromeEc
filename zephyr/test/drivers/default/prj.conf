CONFIG_PLATFORM_EC_CMD_BUTTON=y
CONFIG_PLATFORM_EC_CMD_POWERINDEBUG=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_RTC=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_RTC_ALARM=y
CONFIG_PLATFORM_EC_RTC=y
CONFIG_PLATFORM_EC_VOLUME_BUTTONS=y
CONFIG_TASK_HOSTCMD_THREAD_MAIN=y

CONFIG_SYSTEM_FAKE=y
CONFIG_GPIO_GET_CONFIG=y
CONFIG_PLATFORM_EC_CHARGER_INPUT_CURRENT_DERATE_PCT=0

# Reset back the i2c priority and disable build time checking, some files have
# hardcoded build checks that we can't work around otherwise.
CONFIG_I2C_INIT_PRIORITY=50
CONFIG_CHECK_INIT_PRIORITIES=n
