common:
  platform_allow: native_sim
tests:
  # The UART API provides both interrupt driven and modes.
  console.output.interrupt:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=n
  console.output.interrupt.noisr:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=n
    - CONFIG_PLATFORM_EC_ISR_CONSOLE_OUTPUT=n
  console.output.polling:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_UART_ASYNC_API=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=n
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
  console.output.polling.noisr:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_UART_ASYNC_API=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=n
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
    - CONFIG_PLATFORM_EC_ISR_CONSOLE_OUTPUT=n
  console.restricted:
    extra_dtc_overlay_files:
    - boards/native_sim_restricted.overlay
    extra_configs:
    - CONFIG_TEST_CONSOLE_RESTRICTED=y
    - CONFIG_BOARD_FINGERPRINT=y
    - CONFIG_FINGERPRINT_SHELL=y
    - CONFIG_PLATFORM_EC_FINGERPRINT=y
    - CONFIG_BORINGSSL_CRYPTO=y
    - CONFIG_CPP=y
    - CONFIG_STD_CPP20=y
    - CONFIG_REQUIRES_FULL_LIBCPP=y
    - CONFIG_COMMON_LIBC_MALLOC=y
    - CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2048
    - CONFIG_PLATFORM_EC_ROLLBACK=y
    - CONFIG_PLATFORM_EC_ROLLBACK_SECRET_SIZE=32
    - CONFIG_FINGERPRINT_SENSOR=y
    - CONFIG_FP_ALGORITHM_TEMPLATE_SIZE=32
    - CONFIG_FINGERPRINT_SUBSYSTEM=y
    - CONFIG_PLATFORM_EC_RANDOM=y
    - CONFIG_EMUL=y
    - CONFIG_FLASH=y
    - CONFIG_GPIO=y
    - CONFIG_PLATFORM_EC_HOSTCMD_CONSOLE=y
    - CONFIG_PLATFORM_EC_HOSTCMD=y
    - CONFIG_INPUT_GPIO_KEYS=y
    - CONFIG_INPUT=y
