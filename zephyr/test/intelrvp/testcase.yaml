common:
  platform_allow: native_sim
tests:
  intelrvp.mtlrvp_npcx.board_power:
    extra_dtc_overlay_files:
      - boards/native_sim.overlay
      - boards/mtlrvp_npcx/board_power.dtsi
    extra_configs:
      - CONFIG_PLATFORM_EC=y
      - CONFIG_TEST_PROJECT_MTLRVPP_NPCX=y
      - CONFIG_AP_X86_INTEL_MTL=y
      - CONFIG_TEST_PROJECT_MTL_BOARD_POWER=y
      - CONFIG_AP_POWER_EVENTS_MOCK=y
      - CONFIG_POWER_SIGNALS_MOCK=y
      - CONFIG_AP_EVENTS=n
      - CONFIG_TEST_X86_NON_DSX_PWRSEQ_MTL=y
      - CONFIG_PLATFORM_EC_HOOKS=n
      - CONFIG_PLATFORM_EC_HIBERNATE=n
      - CONFIG_AP_PWRSEQ_DRIVER=n

  intelrvp.mtlrvp_mchp.board_power:
    extra_dtc_overlay_files:
      - boards/native_sim.overlay
      - boards/mtlrvp_mchp/board_power.dtsi
    extra_configs:
      - CONFIG_PLATFORM_EC=y
      - CONFIG_TEST_PROJECT_MTLRVPP_MCHP=y
      - CONFIG_AP_X86_INTEL_MTL=y
      - CONFIG_TEST_PROJECT_MTL_BOARD_POWER=y
      - CONFIG_AP_POWER_EVENTS_MOCK=y
      - CONFIG_POWER_SIGNALS_MOCK=y
      - CONFIG_AP_EVENTS=n
      - CONFIG_TEST_X86_NON_DSX_PWRSEQ_MTL=y
      - CONFIG_PLATFORM_EC_HOOKS=n
      - CONFIG_PLATFORM_EC_HIBERNATE=n
      - CONFIG_AP_PWRSEQ_DRIVER=n
