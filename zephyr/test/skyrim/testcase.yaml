common:
  platform_allow: native_posix
tests:
  # Baseboard tests
  skyrim.baseboard:
    extra_configs:
    - CONFIG_TEST_BOARD_BASEBOARD=y

  skyrim.baseboard.usb_pd_policy:
    extra_configs:
    - CONFIG_TEST_BOARD_BASEBOARD=y
    - CONFIG_TEST_BOARD_USB_PD_POLICY=y

  skyrim.baseboard.usb_pd_policy.discharge:
    extra_configs:
    - CONFIG_TEST_BOARD_BASEBOARD=y
    - CONFIG_TEST_BOARD_USB_PD_POLICY=y
    - CONFIG_USB_PD_DISCHARGE=y

  # Crystaldrift tests
  skyrim.crystaldrift:
    extra_configs:
    - CONFIG_TEST_BOARD_CRYSTALDRIFT=y

  skyrim.crystaldrift.alt_charger:
    extra_configs:
    - CONFIG_TEST_BOARD_CRYSTALDRIFT=y
    - CONFIG_TEST_BOARD_ALT_CHARGER=y

  skyrim.crystaldrift.fan:
    extra_configs:
    - CONFIG_TEST_BOARD_CRYSTALDRIFT=y
    - CONFIG_TEST_BOARD_FAN=y

  skyrim.crystaldrift.ppc_config:
    extra_configs:
    - CONFIG_TEST_BOARD_CRYSTALDRIFT=y
    - CONFIG_TEST_BOARD_PPC_CONFIG=y

  # Frostflow tests
  skyrim.frostflow:
    extra_configs:
    - CONFIG_TEST_BOARD_FROSTFLOW=y

  skyrim.frostflow.ppc_config:
    extra_configs:
    - CONFIG_TEST_BOARD_FROSTFLOW=y
    - CONFIG_TEST_BOARD_PPC_CONFIG=y

  # skyrim.frostflow.usb_mux_config:
  #   extra_configs:
  #   - CONFIG_TEST_BOARD_FROSTFLOW=y
  #   - CONFIG_TEST_BOARD_USB_MUX_CONFIG=y
  #   - CONFIG_TEST_BOARD_USB_MUX_CONFIG_SRC="frostflow/usb_mux_config.c"

  # Markarth tests
  skyrim.markarth:
    extra_configs:
    - CONFIG_TEST_BOARD_MARKARTH=y

  skyrim.markarth.fan:
    extra_configs:
    - CONFIG_TEST_BOARD_MARKARTH=y
    - CONFIG_TEST_BOARD_FAN=y

  skyrim.markarth.ppc_config:
    extra_configs:
    - CONFIG_TEST_BOARD_MARKARTH=y
    - CONFIG_TEST_BOARD_PPC_CONFIG=y

  # Skyrim tests
  skyrim.skyrim:
    extra_configs:
    - CONFIG_TEST_BOARD_SKYRIM=y

  skyrim.skyrim.alt_charger:
    extra_configs:
    - CONFIG_TEST_BOARD_SKYRIM=y
    - CONFIG_TEST_BOARD_ALT_CHARGER=y

  skyrim.skyrim.fan:
    extra_configs:
    - CONFIG_TEST_BOARD_SKYRIM=y
    - CONFIG_TEST_BOARD_FAN=y

  skyrim.skyrim.ppc_config:
    extra_configs:
    - CONFIG_TEST_BOARD_SKYRIM=y
    - CONFIG_TEST_BOARD_PPC_CONFIG=y

  skyrim.skyrim.clamshell:
    extra_args:
      DTC_OVERLAY_FILE="./boards/skyrim/skyrim.dtsi;"
    extra_configs:
    - CONFIG_PLATFORM_EC_BOARD_VERSION_CBI=y
    - CONFIG_PLATFORM_EC_DYNAMIC_MOTION_SENSOR_COUNT=y
    - CONFIG_PLATFORM_EC_GMR_TABLET_MODE=y
    - CONFIG_PLATFORM_EC_TABLET_MODE=y
    - CONFIG_TEST_BOARD_SKYRIM=y
    - CONFIG_TEST_BOARD_FF_CLAMSHELL=y
    - CONFIG_TEST_BOARD_FF_CLAMSHELL_SRC="skyrim/clamshell.c"

  skyrim.skyrim.convertible:
    extra_args:
      DTC_OVERLAY_FILE="./boards/skyrim/skyrim.dtsi;"
    extra_configs:
    - CONFIG_PLATFORM_EC_BOARD_VERSION_CBI=y
    - CONFIG_PLATFORM_EC_DYNAMIC_MOTION_SENSOR_COUNT=y
    - CONFIG_PLATFORM_EC_GMR_TABLET_MODE=y
    - CONFIG_PLATFORM_EC_TABLET_MODE=y
    - CONFIG_TEST_BOARD_SKYRIM=y
    - CONFIG_TEST_BOARD_FF_CONVERTIBLE=y
    - CONFIG_TEST_BOARD_FF_CONVERTIBLE_SRC="skyrim/convertible.c"

  # Winterhold tests
  skyrim.winterhold:
    extra_configs:
    - CONFIG_TEST_BOARD_WINTERHOLD=y

  skyrim.winterhold.ppc_config:
    extra_configs:
    - CONFIG_TEST_BOARD_WINTERHOLD=y
    - CONFIG_TEST_BOARD_PPC_CONFIG=y
    - CONFIG_TEST_BOARD_PPC_CONFIG_SRC="winterhold/ppc_config.c"
