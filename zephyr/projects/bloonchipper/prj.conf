## Zephyr Configuration

# Power management
CONFIG_PM=y

# Console
CONFIG_UART_CONSOLE_INPUT_EXPIRED=y

# Serial
CONFIG_UART_ASYNC_API=n # Disable UART DMA for now (problem with lost characters)

# SPI
CONFIG_SPI=y

# DMA
CONFIG_DMA=y

# WATCHDOG configuration
CONFIG_WATCHDOG=y
CONFIG_IWDG_STM32_INITIAL_TIMEOUT=10000

# RTC & timers
CONFIG_COUNTER=y

# BBRAM
CONFIG_BBRAM=y

# Flash
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_STM32_WRITE_PROTECT=y
CONFIG_FLASH_STM32_READOUT_PROTECTION=y

# Hwinfo (used by cros-system)
CONFIG_HWINFO=y

# Logging
CONFIG_LOG=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y

# Shell commands
CONFIG_FLASH_SHELL=y
#CONFIG_FLASH_SHELL_WRITE_PROTECT=y
#CONFIG_FLASH_SHELL_READOUT_PROTECTION=y
CONFIG_BBRAM_SHELL=y

## Cros EC configuration

CONFIG_CROS_EC=y

# Platform EC
CONFIG_PLATFORM_EC=y
CONFIG_PLATFORM_EC_ACPI=n
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_HOSTCMD_GET_UPTIME_INFO=y
# CONFIG_PLATFORM_EC_POWER_COMMON=n Same, we can't disable it directly :P
CONFIG_PLATFORM_EC_MKBP_EVENT=y
CONFIG_PLATFORM_EC_PORT80=n
# CONFIG_PLATFORM_EC_RTC=y Disable it for now because it requires rtc driver
CONFIG_PLATFORM_EC_SWITCH=n
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_VBOOT_HASH=n
CONFIG_PLATFORM_EC_VSTORE=n

# Do we really need it?
CONFIG_PLATFORM_EC_CROS_FWID_VERSION=y

CONFIG_PLATFORM_EC_FLASH_INIT_PRIORITY=60

# Enable watchdog helper
CONFIG_PLATFORM_EC_WATCHDOG_HELPER=y

# Disable keyboard support.
CONFIG_PLATFORM_EC_KEYBOARD=n

# task_wait_event() & friends.
CONFIG_SHIMMED_TASKS=y

# Enable RDP functionality.
CONFIG_CROS_FLASH_STM32_READOUT_PROTECTION=y

# Make sure cros-system driver for STM32 is compiled
CONFIG_CROS_SYSTEM_STM32=y
CONFIG_CROS_SYSTEM_STM32_INIT_PRIORITY=71
CONFIG_PLATFORM_EC_SYSTEM_PRE_INIT_PRIORITY=72

## Debugging
CONFIG_FLASH_STM32_BLOCK_WRITE_PROTECT_DISABLING=y
CONFIG_FLASH_LOG_LEVEL_DBG=y
