CONFIG_BOARD_ADLRVP_MCHP=y
CONFIG_CROS_FLASH_XEC=y
CONFIG_CROS_SYSTEM_XEC=y

# PWM
####CONFIG_PWM=y
####CONFIG_PWM_SHELL=n
####CONFIG_PLATFORM_EC_PWM=y

# Not need for MCHP chip
CONFIG_SYSCON=n
# Keyboard doesn't support KEYPAD - 13 Columns
CONFIG_PLATFORM_EC_KEYBOARD_KEYPAD=n

# Keyboard
CONFIG_CROS_KB_RAW_XEC=y

# For MCHP ESPI EMI
CONFIG_ESPI_PERIPHERAL_EC_HOST_CMD=y
CONFIG_ESPI_PERIPHERAL_ACPI_SHM_REGION=y
CONFIG_ESPI_PERIPHERAL_CUSTOM_OPCODE=y
CONFIG_ESPI_PERIPHERAL_XEC_EMI0=y

# 02/07 debug
# WATCHDOG configuration
CONFIG_WATCHDOG=n
CONFIG_WDT_XEC=n

#CONFIG_ARCH_HAS_CUSTOM_BUSY_WAIT=n

# USB-C and PD
CONFIG_PLATFORM_EC_USB_PD_PORT_MAX_COUNT=2
