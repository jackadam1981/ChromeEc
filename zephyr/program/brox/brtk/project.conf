# Brox reference-board-specific Kconfig settings.
CONFIG_BOARD_BRTK=y

#RTK_NEED_IMP : reset hotkey
#CONFIG_PLATFORM_EC_KEYBOARD_REFRESH_ROW3=y

CONFIG_USBC_PDC_TRACE_MSG=y

# RTK_NEED_IMP : jump
CONFIG_PLATFORM_EC_VBOOT_HASH=n

# RTK_NEED_IMP : power on, disable auto power on.
# CONFIG_PLATFORM_EC_BRINGUP=y

CONFIG_PLATFORM_EC_VBOOT_HASH=y

CONFIG_PLATFORM_EC_WATCHDOG_PERIOD_MS=10000
CONFIG_USB_PDC_LOG_LEVEL_ERR=y
CONFIG_INIT_ARCH_HW_AT_BOOT=y