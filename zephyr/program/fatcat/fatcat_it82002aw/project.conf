# fatcat_it82002aw board-specific Kconfig settings.

CONFIG_BOARD_FATCAT_IT82002AW=y

CONFIG_AP=y
CONFIG_ESPI=y
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S3=y
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S4=y
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S5=y

# GSC card
CONFIG_PLATFORM_EC_IOEX_IT8801=y
CONFIG_PLATFORM_EC_KEYBOARD=y
CONFIG_PLATFORM_EC_KEYBOARD_DISCRETE=y
#CONFIG_PLATFORM_EC_KEYBOARD_PROTOCOL_8042=y

# begin: intelrvp/ptlrvp/pd.conf

CONFIG_PLATFORM_EC_USB_PD_DP_MODE=y
CONFIG_PLATFORM_EC_USB_PD_HOST_CMD=y
CONFIG_PLATFORM_EC_USB_PD_REQUIRE_AP_MODE_ENTRY=n
CONFIG_PLATFORM_EC_USB_PD_REV30=y
CONFIG_PLATFORM_EC_USB_PD_VBUS_MEASURE_NOT_PRESENT=y

# Disable Power Delivery Function
CONFIG_PLATFORM_EC_USBC_SS_MUX=n
CONFIG_PLATFORM_EC_USB_CHARGER=n
CONFIG_PLATFORM_EC_USBC_PPC=n
CONFIG_PLATFORM_EC_USBC_RETIMER_FW_UPDATE=n
CONFIG_PLATFORM_EC_HOSTCMD_PD_CONTROL=n
CONFIG_PLATFORM_EC_HOSTCMD_PD_CHIP_INFO=n
CONFIG_PLATFORM_EC_HOSTCMD_RWHASHPD=n

# Disable typec host commands
CONFIG_PLATFORM_EC_HOSTCMD_TYPEC_DISCOVERY=n
CONFIG_PLATFORM_EC_HOSTCMD_TYPEC_STATUS=n

# end: intelrvp/ptlrvp/pd.conf

# begin: intelrvp/ptlrvp/program.conf

# Disable BC1.2
CONFIG_PLATFORM_EC_USB_CHARGER=n

# Charger
CONFIG_PLATFORM_EC_CHARGER_RAA489110=y
CONFIG_PLATFORM_EC_CHARGER_DISCHARGE_ON_AC=y
CONFIG_PLATFORM_EC_CHARGER_SENSE_RESISTOR=5
CONFIG_PLATFORM_EC_CHARGER_SENSE_RESISTOR_AC=10
CONFIG_PLATFORM_EC_CHARGE_RAMP_HW=n
CONFIG_PLATFORM_EC_DEDICATED_CHARGE_PORT=y

# USB
CONFIG_PLATFORM_EC_USB_PD_VBUS_MEASURE_CHARGER=y
CONFIG_PLATFORM_EC_PD_MAX_POWER_MW=120000

# end: intelrvp/ptlrvp/program.conf

# begin: intelrvp/prj.conf

CONFIG_PLATFORM_EC_EXTPOWER_GPIO=y

# Battery
CONFIG_PLATFORM_EC_BATTERY_CUT_OFF=y
CONFIG_PLATFORM_EC_BATTERY_FUEL_GAUGE=y
CONFIG_PLATFORM_EC_BATTERY_PRESENT_GPIO=y
CONFIG_PLATFORM_EC_BATTERY_REVIVE_DISCONNECT=y
CONFIG_PLATFORM_EC_CHARGER_MIN_POWER_MW_FOR_POWER_ON_WITH_BATT=15000
CONFIG_PLATFORM_EC_CHARGER_MIN_POWER_MW_FOR_POWER_ON=15001
CONFIG_PLATFORM_EC_CHARGER_MIN_INPUT_CURRENT_LIMIT=512

# end: intelrvp/prj.conf

CONFIG_PLATFORM_EC_USB_PD_CONTROLLER=y

#CONFIG_PLATFORM_EC_USB_PD_DISCHARGE=n
