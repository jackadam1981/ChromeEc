# Variant config
CONFIG_BOARD_ROACH=y

CONFIG_PLATFORM_EC_TOUCHPAD_ELAN=y
CONFIG_PLATFORM_EC_RWSIG=n
CONFIG_PLATFORM_EC_RSA_EXPONENT_3=n

CONFIG_PLATFORM_EC_ONE_WIRE_UART_KEYBOARD=n

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_DBG=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_PID=0x5999
CONFIG_USBD_HID_SN="0"
CONFIG_USBD_HID_REMOTE_WAKEUP=y
#CONFIG_USBD_HID_KEYBOARD=y
#CONFIG_USBD_HID_VIVALDI=y
CONFIG_USB_DC_HID_KEYBOARD=y
CONFIG_USB_DC_HID_VIVALDI=y
CONFIG_USB_DC_HID_TOUCHPAD=y
