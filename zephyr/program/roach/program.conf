CONFIG_CROS_EC=y
CONFIG_PLATFORM_EC=y
CONFIG_SHIMMED_TASKS=y

# SoC configuration
CONFIG_AP=n

# Optional features
CONFIG_PLATFORM_EC_CONSOLE_CMD_CHARGEN=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_I2C_PORTMAP=n

# UART
CONFIG_UART_INTERRUPT_DRIVEN=y

# Touchpad
CONFIG_PLATFORM_EC_TOUCHPAD_ELAN=y

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD=y

# MKBP
CONFIG_PLATFORM_EC_CBI=n
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_SWITCH=y
# Since PLATFORM_EC_SWITCH config option above depends on PLATFORM_EC_HOSTCMD,
# enable this config option to make build happy.
# NOTE: The host command task isn't requried on this platform.
CONFIG_PLATFORM_EC_HOSTCMD=y
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_VBOOT_HASH=n

# USB-C
CONFIG_PLATFORM_EC_USB_PD_TBT_COMPAT_MODE=n
CONFIG_PLATFORM_EC_USB_PD_USB4=n
