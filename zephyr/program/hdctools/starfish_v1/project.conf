# Configure Board name
CONFIG_BOARD_STARFISH_V1=y

# Enable the DFU Bootloader
CONFIG_DFU_BOOTLOADER=y

# Configure Debug Logger
CONFIG_LOG=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_TIMESTAMP_64BIT=y

CONFIG_ADC=y
CONFIG_ADC_SHELL=y
CONFIG_ADC_STM32=y
CONFIG_ADC_LOG_LEVEL_DBG=y

# Configure Shell
CONFIG_SHELL=y
CONFIG_SHELL_ECHO_STATUS=y
CONFIG_SHELL_GETOPT=n
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HELP_OPT_PARSE=n
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_LOG_FORMAT_TIMESTAMP=n
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_PROMPT_UART="Starfish:~$ "

# Configure USB
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PID=0x5060
CONFIG_USB_DEVICE_PRODUCT="Starfish"
CONFIG_USB_DEVICE_STACK=y

# Configure Flash partitions
CONFIG_USE_DT_CODE_PARTITION=y


CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_FCB=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_RING_BUFFER=y

CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
