CONFIG_CROS_EC=y
CONFIG_PLATFORM_EC=y

CONFIG_I2C_TARGET=y
CONFIG_I2C_LOG_LEVEL_INF=y

# it8801 test
CONFIG_MFD=y
CONFIG_INPUT=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y
CONFIG_INPUT_SHELL_KBD_MATRIX_STATE=y
CONFIG_CROS_EC_KEYBOARD_INPUT=y

# SoC configuration
CONFIG_AP=y
CONFIG_AP_ARM_MTK_MT8192=y

CONFIG_ASSERT=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_PLATFORM_EC_ADC_RESOLUTION=12

# Lid switch
CONFIG_PLATFORM_EC_LID_SWITCH=y

# Power Button
CONFIG_PLATFORM_EC_POWER_BUTTON=y

# TODO(b:185202623): bring these features up
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_BOARD_VERSION_CBI=n
CONFIG_PLATFORM_EC_BOARD_VERSION_GPIO=n
CONFIG_PLATFORM_EC_KEYBOARD=n
CONFIG_PLATFORM_EC_SWITCH=n
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_VBOOT_HASH=n
