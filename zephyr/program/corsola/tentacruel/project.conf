# Variant config
CONFIG_BOARD_TENTACRUEL=y

# USB-C
CONFIG_PLATFORM_EC_USB_MUX_TUSB546=n

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_REFRESH_ROW3=y

# Sensor
CONFIG_PLATFORM_EC_ACCELGYRO_BMI3XX=y
CONFIG_PLATFORM_EC_ACCELGYRO_BMI_COMM_I2C=y
CONFIG_PLATFORM_EC_DYNAMIC_MOTION_SENSOR_COUNT=y
CONFIG_PLATFORM_EC_ACCEL_SPOOF_MODE=y

# Battery
CONFIG_PLATFORM_EC_CHARGER_PROFILE_OVERRIDE=y
CONFIG_PLATFORM_EC_I2C_NACK_RETRY_COUNT=10
CONFIG_PLATFORM_EC_SMBUS_PEC=y
CONFIG_PLATFORM_EC_SMART_BATTERY_OPTIONAL_MFG_FUNC=y
CONFIG_PLATFORM_EC_I2C_VIRTUAL_BATTERY_ADDR=0x0f

# Remove bring up options for FW QUAL
CONFIG_PLATFORM_EC_BRINGUP=n
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=n

# Slightly improved performance
CONFIG_LTO=y # SRAM_SIZE > 128, LTO is disabled
CONFIG_SOC_IT8XXX2_SERIAL_IN_RAM=y
CONFIG_SOC_IT8XXX2_KERNEL_IN_RAM=y
CONFIG_SOC_IT8XXX2_ZEPHYR_IN_RAM=y
CONFIG_SOC_IT8XXX2_SWITCH_IN_RAM=y
CONFIG_SOC_IT8XXX2_EXCEPTIONS_IN_RAM=y
CONFIG_SHELL_MINIMAL=y
CONFIG_KERNEL_SHELL=n
CONFIG_KERNEL_LTO_ALLOWLIST="init.c errno.c fatal.c timer.c"

CONFIG_SHELL_HELP=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCELS=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCEL_INFO=n
# CONFIG_PLATFORM_EC_CONSOLE_CMD_APTHROTTLE=n # already disabled
CONFIG_PLATFORM_EC_CONSOLE_CMD_FLASH=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_MEM=n

#CONFIG_THREAD_ANALYZER=y
#CONFIG_THREAD_ANALYZER_USE_PRINTK=y
#CONFIG_THREAD_ANALYZER_AUTO=y
#CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
