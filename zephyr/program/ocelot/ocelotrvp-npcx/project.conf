# ocelotrvp-npcx board-specific Kconfig settings.

CONFIG_BOARD_OCELOTRVP_NPCX=y

# Enable AP over eSPI
CONFIG_ESPI=y

CONFIG_AP=y

# Charger
CONFIG_PLATFORM_EC_CHARGER_DISCHARGE_ON_AC=y

# Battery
CONFIG_PLATFORM_EC_BATTERY_CUT_OFF=y
CONFIG_PLATFORM_EC_BATTERY_REVIVE_DISCONNECT=y

CONFIG_PLATFORM_EC_CHARGER_MIN_POWER_MW_FOR_POWER_ON_WITH_BATT=15000
CONFIG_PLATFORM_EC_CHARGER_MIN_POWER_MW_FOR_POWER_ON=65000
CONFIG_PLATFORM_EC_CHARGER_MIN_INPUT_CURRENT_LIMIT=512

#IOEX present on main board
CONFIG_GPIO_PCA95XX_INIT_PRIORITY=50

CONFIG_PLATFORM_EC_CBI=y
