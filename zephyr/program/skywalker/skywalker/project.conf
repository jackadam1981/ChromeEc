CONFIG_BOARD_SKYWALKER=y

CONFIG_PLATFORM_EC_ACCELGYRO_BMI3XX=y
CONFIG_PLATFORM_EC_ACCELGYRO_BMI_COMM_I2C=y
CONFIG_PLATFORM_EC_ACCEL_BMA4XX=y
CONFIG_PLATFORM_EC_ACCEL_LIS2DW12=y

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_COL2_INVERTED=y
CONFIG_PLATFORM_EC_KEYBOARD_CUSTOMIZATION=y
CONFIG_PLATFORM_EC_KEYBOARD_KEYPAD=y

# Enable configuring pdc log at runtime.
#
# Note: If we set CONFIG_${module}_LOG_LEVEL_OFF=y, then it will remove all logs
# from the binaries at compile time and we could not enable any log at runtime
# after that.
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_PLATFORM_EC_USB_PDC_RUNTIME_LOG=y
