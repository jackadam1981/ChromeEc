CONFIG_TASK_CHIPSET_STACK_SIZE=1440

CONFIG_PM_DEVICE_RUNTIME=n

CONFIG_PLATFORM_EC_MAX_SENSOR_FREQ_MILLIHZ=100000

# Link some code into RAM to improve performance.
CONFIG_LTO=n
CONFIG_SOC_IT8XXX2_SERIAL_IN_RAM=y
CONFIG_SOC_IT8XXX2_KERNEL_IN_RAM=y
CONFIG_SOC_IT8XXX2_ZEPHYR_IN_RAM=y
CONFIG_SOC_IT8XXX2_RODATA_IN_RAM=y
