CONFIG_CROS_EC=y
CONFIG_PLATFORM_EC=y

# SoC configuration
CONFIG_AP=y
CONFIG_AP_ARM_MTK_MT8192=y

# I2C target
CONFIG_I2C_TARGET=y
CONFIG_I2C_TARGET_ALLOW_POWER_SAVING=y

# Enable assert
CONFIG_ASSERT=y

# Improve perfermance
CONFIG_LTO=n
#CONFIG_SOC_IT8XXX2_KERNEL_IN_RAM=y
#CONFIG_KERNEL_LTO_ALLOWLIST="init.c errno.c fatal.c timer.c"
#CONFIG_I2C_ENHANCE_CODE_IN_RAM=y
#CONFIG_SOC_IT8XXX2_RAM_CODE_NOINLINE=y
#CONFIG_SOC_IT8XXX2_RODATA_IN_RAM=y

CONFIG_SOC_IT8XXX2_SERIAL_IN_RAM=n
CONFIG_SOC_IT8XXX2_KERNEL_IN_RAM=n
CONFIG_SOC_IT8XXX2_ZEPHYR_IN_RAM=n
# Lid switch
CONFIG_PLATFORM_EC_LID_SWITCH=n

# Power Button
CONFIG_PLATFORM_EC_POWER_BUTTON=n

# TODO(b:185202623): bring these features up
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_BOARD_VERSION_CBI=n
CONFIG_PLATFORM_EC_BOARD_VERSION_GPIO=n
CONFIG_PLATFORM_EC_KEYBOARD=n
CONFIG_PLATFORM_EC_SWITCH=n
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_VBOOT_HASH=n
