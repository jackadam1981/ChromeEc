# Charger
CONFIG_PLATFORM_EC_CHARGER_ILIM_PIN_DISABLED=y

# IMVP9
CONFIG_PLATFORM_EC_PMIC=y

CONFIG_PDC_RUNTIME_PORT_CONFIG=y

# DSP
CONFIG_PLATFORM_EC_DSP_SERVICE=y
CONFIG_PLATFORM_EC_DSP_INIT_PRIORITY=80
CONFIG_PLATFORM_EC_DSP_REMOTE_BODY_DETECTION=y
CONFIG_PLATFORM_EC_DSP_REMOTE_CBI=y
CONFIG_PLATFORM_EC_DSP_REMOTE_LID_SWITCH=y
CONFIG_PLATFORM_EC_DSP_REMOTE_TABLET_SWITCH=y
CONFIG_PLATFORM_EC_DSP_REMOTE_LID_ANGLE=y
CONFIG_PLATFORM_EC_DSP_RESPONSE_BUFFER_SIZE=128
CONFIG_I2C_TARGET=y

# Tokenize build
CONFIG_PLATFORM_EC_LOG_TOKENIZED=y
CONFIG_PIGWEED_LOG_TOKENIZED_LIB=y
CONFIG_SHELL_CUSTOM_HEADER=y

# Force disable malloc/calloc
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_COMMON_LIBC_CALLOC=n

# b/445058814
CONFIG_PLATFORM_EC_DEBUG_ASSERT=n
