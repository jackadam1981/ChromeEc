# LED
CONFIG_PLATFORM_EC_LED_PWM=n
CONFIG_PLATFORM_EC_LED_ONOFF_STATES=n
CONFIG_PLATFORM_EC_LED_COMMON=y
CONFIG_PWM=y

# EC/DSP comms
CONFIG_I2C_TARGET=y

CONFIG_PDC_RUNTIME_PORT_CONFIG=y

# Fan
CONFIG_PLATFORM_EC_FAN=y
CONFIG_PLATFORM_EC_CUSTOM_FAN_CONTROL=y
