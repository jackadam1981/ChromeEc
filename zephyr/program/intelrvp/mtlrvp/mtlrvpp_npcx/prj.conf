CONFIG_BOARD_MTLRVP_NPCX=y
CONFIG_CROS_SYSTEM_NPCX=y
CONFIG_SYSCON=y

# RTC
CONFIG_PLATFORM_EC_RTC=y

# Watchdog timeout
CONFIG_PLATFORM_EC_WATCHDOG_PERIOD_MS=6000
CONFIG_WDT_NPCX_DELAY_CYCLES=4
