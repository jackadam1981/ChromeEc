CONFIG_BOARD_PTLRVP_MCHP=y
CONFIG_CROS_SYSTEM_XEC=y

CONFIG_MCHP_MEC_UNSIGNED_HEADER=y
CONFIG_MCHP_MEC_HEADER_FLASH_SIZE_256K=y

# For MCHP ESPI Drivers
CONFIG_ESPI_PERIPHERAL_EC_HOST_CMD=y
CONFIG_ESPI_PERIPHERAL_ACPI_SHM_REGION=y
CONFIG_ESPI_PERIPHERAL_CUSTOM_OPCODE=y
CONFIG_ESPI_PERIPHERAL_XEC_EMI0=y
CONFIG_ESPI_PERIPHERAL_ACPI_EC_IBF_EVT_DATA=y
CONFIG_ESPI_PERIPHERAL_KBC_OBE_CBK=y
CONFIG_ESPI_PERIPHERAL_KBC_IBF_EVT_DATA=y

CONFIG_PLATFORM_EC_POWER_BUTTON_IGNORE_LID=y

# IOEX present on GSC AIC
# TODO: Use upstream Zephyr driver b/386325459
CONFIG_PLATFORM_EC_IOEX_IT8801=y

# Enable tablet mode
CONFIG_PLATFORM_EC_TABLET_MODE=y
CONFIG_PLATFORM_EC_TABLET_MODE_SWITCH=y

# DSP
CONFIG_PLATFORM_EC_DSP_SERVICE=y
CONFIG_PLATFORM_EC_DSP_INIT_PRIORITY=80
CONFIG_PLATFORM_EC_DSP_REMOTE_CBI=y
CONFIG_PLATFORM_EC_DSP_REMOTE_LID_SWITCH=y
CONFIG_PLATFORM_EC_DSP_REMOTE_LID_ANGLE=y
CONFIG_PLATFORM_EC_DSP_REMOTE_TABLET_SWITCH=y
CONFIG_PLATFORM_EC_DSP_RESPONSE_BUFFER_SIZE=128
CONFIG_I2C_TARGET=y

# Disable WDT for debugging
# TODO: remove when b/394349276 is resolved
CONFIG_WDT_DISABLE_AT_BOOT=y
CONFIG_CRYPTO=y
